<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaayakkadi History</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        header { text-align: center; margin-bottom: 20px; color: #4f46e5; font-size: 1.5rem; font-weight: bold; }
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; white-space: nowrap; }
        th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background-color: #f8fafc; font-weight: 600; color: #64748b; text-transform: uppercase; font-size: 0.75rem; }
        .spinner {
            border: 4px solid #f3f3f3; border-top: 4px solid #4f46e5;
            border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="container">
        <header>☕ Chaayakkadi Event History</header>
        
        <div id="loader" style="text-align: center;">
            <div class="spinner"></div>
            <p>Loading latest events...</p>
        </div>

        <div class="table-responsive" id="table-container" style="display: none;">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Host</th>
                        <th>Treat Type</th>
                        <th>Pax</th>
                        <th>Amount (₹)</th>
                    </tr>
                </thead>
                <tbody id="history-table-body">
                    <!-- Data injected here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // ==========================================
        // ⚠️ PASTE YOUR GOOGLE APPS SCRIPT URL BELOW
        // ==========================================
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyjxC4Z_bE7e7R9Qu65ySV8TihwOqooih-Li62fBBTcVzMmKE5_UfATzLXpHmx9bOpr/exec';
        // ==========================================

        function formatHistoryDate(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            return `${d.getDate().toString().padStart(2, '0')}-${months[d.getMonth()]}-${d.getFullYear()}`;
        }

        async function fetchHistory() {
            try {
                let response = await fetch(SCRIPT_URL);
                let data = await response.json();
                
                let events = data.events || [];
                events.sort((a,b) => b.id - a.id); // Newest first

                const tbody = document.getElementById('history-table-body');
                tbody.innerHTML = events.map(e => `
                    <tr>
                        <td>${formatHistoryDate(e.date)}</td>
                        <td style="font-weight: 500;">${e.hostName}</td>
                        <td><span style="background: #f8fafc; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; border: 1px solid #e2e8f0;">${e.treatType}</span></td>
                        <td>${e.totalParticipants}</td>
                        <td style="color: #10b981; font-weight: 700;">₹${e.totalAmount}</td>
                    </tr>
                `).join('');

                if (events.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 20px; color: #64748b;">No events recorded yet.</td></tr>`;
                }

                document.getElementById('loader').style.display = 'none';
                document.getElementById('table-container').style.display = 'block';

            } catch(e) {
                document.getElementById('loader').innerHTML = `<p style="color:red;">Failed to load data. Please try again later.</p>`;
            }
        }

        fetchHistory();
    </script>
</body>
</html>
